# Single source of truth for fonts, the way palettes.json is for colours.
# Written by qs-font. Quickshell reads this live; everything else is rewritten
# in place by the same script.
#
# mono    terminal, bar, notifications, code. MUST be a Nerd Font — the bar
#         draws its icons from Nerd Font glyphs and they vanish without one.
# ui      GTK/Qt application interfaces.
# size    base point size (kitty adds 2).
# weight  face name: Thin, ExtraLight, Light, Regular, Medium, SemiBold,
#         Bold, ExtraBold, Black. Pango gets the word, Qt/QML the number.
#
# Monaspace Argon (GitHub's humanist-sans code face) via the Nerd Fonts
# patched build, where the family is named "MonaspiceAr". Ligatures and
# texture healing are OpenType liga/calt features, on by default in kitty,
# Pango and Qt — nothing extra is needed to get what the preview showed.

mono   = MonaspiceAr Nerd Font
ui     = MonaspiceAr Nerd Font
size   = 11
weight = Bold
