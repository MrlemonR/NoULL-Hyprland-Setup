# cava config for the two spectrum strips beside the workspaces.
#
# Only the bar reads this; cava is started as `cava -p <this file>` by
# CavaService.qml and its raw ASCII output is parsed line by line.
#
# Deliberately small: 12 bars is what fits next to the workspaces at 1920px,
# and 30 fps is plenty for something 16px tall — cava defaults to 60, which is
# 60 lines a second to parse in QML for no visible gain.

[general]
framerate = 30
bars = 12
autosens = 1

[input]
method = pulse
source = auto

[output]
# One line per frame: "v;v;…;v" with v in 0..100.
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono

[smoothing]
noise_reduction = 40
